<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vlan-rs dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1f2328;
    --muted: #57606a;
    --border: #d0d7de;
    --bg: #ffffff;
    --bg-soft: #f6f8fa;
    --bad-bg: #ffebe9;
    --bad-fg: #a40e26;
    --good-bg: #dafbe1;
    --good-fg: #116329;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --bg: #0d1117;
      --bg-soft: #161b22;
      --bad-bg: #2d0f0f;
      --bad-fg: #f85149;
      --good-bg: #0d2818;
      --good-fg: #3fb950;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
  .refresh { color: var(--muted); font-size: 0.8rem; margin-bottom: 1.2rem; }
  .refresh.stale { color: var(--bad-fg); }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; font-size: 0.88rem; }
  th, td { border: 1px solid var(--border); padding: 0.45rem 0.65rem; text-align: left; }
  th { background: var(--bg-soft); }
  tr.blocked td { background: var(--bad-bg); color: var(--bad-fg); font-weight: 600; }
  .badge { display: inline-block; padding: 0.05rem 0.45rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }
  .badge.ok { background: var(--good-bg); color: var(--good-fg); }
  .badge.blocked { background: var(--bad-bg); color: var(--bad-fg); }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<h1>vlan-rs dashboard</h1>
<div class="refresh" id="refresh">loading…</div>

<table>
  <thead>
    <tr><th>Port</th><th>Mode</th><th>Status</th><th>Frames in</th><th>Bytes in</th><th>Frames out</th><th>Bytes out</th><th>Drops</th></tr>
  </thead>
  <tbody id="ports"></tbody>
</table>

<table>
  <thead>
    <tr><th>VLAN</th><th>Frames in</th><th>Bytes in</th><th>Frames out</th><th>Bytes out</th></tr>
  </thead>
  <tbody id="vlans"></tbody>
</table>

<script>
// No framework, no build step: this file is served byte-for-byte from
// src/dashboard/index.html via include_str!. Polls /api/counters, the
// same counters SIGUSR1 dumps to stderr, plus each port's mode.
const POLL_INTERVAL_MS = 2000;

function describeMode(mode) {
  if (!mode) return "";
  if (mode.kind === "access") return `access, vlan ${mode.vlan}`;
  const native = mode.native === null ? "-" : mode.native;
  return `trunk, native ${native}, allowed [${mode.allowed.join(", ")}]`;
}

// Counters arrive as JSON strings, not bare numbers — a u64 can exceed
// 2^53, past which JS's own f64-backed numbers silently lose precision.
// BigInt is exact regardless of magnitude, and still formats with the
// same thousands separators Number.toLocaleString() would give.
function fmtCount(str) {
  return BigInt(str).toLocaleString();
}

function renderPorts(ports) {
  const tbody = document.getElementById("ports");
  if (ports.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">no ports registered</td></tr>';
    return;
  }
  tbody.innerHTML = ports.map(p => `
    <tr class="${p.blocked ? "blocked" : ""}">
      <td>PortId(${p.port})</td>
      <td>${describeMode(p.mode)}</td>
      <td><span class="badge ${p.blocked ? "blocked" : "ok"}">${p.blocked ? "blocked" : "ok"}</span></td>
      <td>${fmtCount(p.frames_in)}</td>
      <td>${fmtCount(p.bytes_in)}</td>
      <td>${fmtCount(p.frames_out)}</td>
      <td>${fmtCount(p.bytes_out)}</td>
      <td>${fmtCount(p.drops)}</td>
    </tr>
  `).join("");
}

function renderVlans(vlans) {
  const tbody = document.getElementById("vlans");
  if (vlans.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">no VLAN traffic yet</td></tr>';
    return;
  }
  tbody.innerHTML = vlans.map(v => `
    <tr>
      <td>${v.vlan}</td>
      <td>${fmtCount(v.frames_in)}</td>
      <td>${fmtCount(v.bytes_in)}</td>
      <td>${fmtCount(v.frames_out)}</td>
      <td>${fmtCount(v.bytes_out)}</td>
    </tr>
  `).join("");
}

async function refresh() {
  const el = document.getElementById("refresh");
  try {
    const res = await fetch("/api/counters", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderPorts(data.ports);
    renderVlans(data.vlans);
    el.textContent = `auto-refreshing every ${POLL_INTERVAL_MS / 1000}s · last updated ${new Date().toLocaleTimeString()}`;
    el.classList.remove("stale");
  } catch (err) {
    el.textContent = `couldn't reach the switch: ${err.message}`;
    el.classList.add("stale");
  }
}

refresh();
setInterval(refresh, POLL_INTERVAL_MS);
</script>
</body>
</html>
