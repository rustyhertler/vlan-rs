[package]
name = "vlan-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1.1.4"
tun-rs = { version = "2.8.8", features = ["async"] }

[dev-dependencies]
etherparse = "0.21.0"
rusty-hook = "0.11"
